name: Build & Publish Lumen OTA Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.4)'
        required: true
        default: 'v1.0.4'

permissions:
  contents: write

jobs:
  build-android-and-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle & sync Capacitor Android
        run: |
          npx tsc --noEmit
          npx vite build
          npx cap sync android

      - name: Restore consistent Android debug keystore (if secret configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Package Web OTA bundle & manifest
        run: |
          node scripts/package-ota-release.mjs
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-ota/Lumen-debug.apk

      - name: Upload Android & Web OTA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ota-android-web
          path: |
            dist-ota/ota-manifest.json
            dist-ota/lumen-web-bundle.zip
            dist-ota/Lumen-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Windows Electron installer
        run: |
          npx tsc --noEmit
          npx vite build
          npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ota-windows
          path: |
            dist-electron/Lumen-Setup.exe
            dist-electron/Lumen-Setup.exe.blockmap
            dist-electron/latest.yml

  publish-release:
    needs: [build-android-and-web, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Lumen ${{ steps.tag.outputs.name }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/ota-manifest.json
            release-assets/lumen-web-bundle.zip
            release-assets/Lumen-debug.apk
            release-assets/Lumen-Setup.exe
            release-assets/Lumen-Setup.exe.blockmap
            release-assets/latest.yml
